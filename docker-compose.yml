version: "3.8"
services:
  # Container Aplikasi Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: laravel-app  <-- HAPUS ATAU KOMENTAR BARIS INI
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - laravel_code:/var/www      # <--- PASTIKAN INI PAKAI VOLUME SHARED
    networks:
      - laravel

  # Container Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - laravel_code:/var/www      # <--- INI JUGA HARUS SAMA
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - laravel

  # Container Database
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
    driver: local
  laravel_code:   # <--- VOLUME BARU WAJIB ADA
    driver: local
